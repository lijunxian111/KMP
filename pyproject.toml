[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kmp-reproduction"
version = "0.1.0"
description = "Paper-based reconstruction of KMP (arXiv:2403.01079v1)"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "torch-geometric>=2.5,<3", "numpy>=1.26,<3", "scipy>=1.12,<2", "PyYAML>=6,<7", "networkx>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ogb = ["ogb>=1.3.6,<2"]

[project.scripts]
kmp = "kmp.cli:main"

[tool.setuptools.packages.find]
include = ["kmp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
